name: Publish to Hex

# Tag-triggered release: push a `v*` tag matching @version in mix.exs.
# A tag push is the only publish path; to recover from a failed run, re-run its
# failed job.
#
# Publishing authenticates to hex.pm with the job's OIDC token (workload
# identity); there is no stored key. hex.pm trusts this repository's
# publish.yml running in the `prod` environment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The test dependencies compile and run here, in a job with no environment and
  # no OIDC token, so nothing they run can ask hex.pm for a publish token.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - run: mix deps.get
      - run: mix test
        env:
          MIX_ENV: test

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Only this job may mint the OIDC token. The job-level block replaces the
    # workflow-level one, so it restates contents: read.
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - name: hex supports workload identity
        run: bash .github/scripts/hex-workload-identity.sh
      - run: mix deps.get
      - name: Publish
        # No MIX_ENV override: hex.publish builds docs, and ex_doc is
        # `only: :dev` — the docs task doesn't exist outside dev.
        run: mix hex.publish --yes
